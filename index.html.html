<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back in Shape</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F3;--card:#FFFFFF;--ink:#14303A;--mute:#56707A;--line:#D5DFDB;--accent:#F0B429;--on-accent:#14303A;--mob:#2A8C8C;--car:#D94F6B;--str:#5B5BD6;--danger:#C42B36;--on-danger:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E24;--card:#183039;--ink:#EAF2EF;--mute:#9DB5BC;--line:#2A4650;--danger:#FF7A80;--on-danger:#14303A}}
:root[data-theme="dark"]{--bg:#0F1E24;--card:#183039;--ink:#EAF2EF;--mute:#9DB5BC;--line:#2A4650;--danger:#FF7A80;--on-danger:#14303A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(18px*var(--s,1))/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:calc(30px*var(--s,1));line-height:1.15;margin:8px 0 4px}
h2{font-size:calc(22px*var(--s,1));margin:26px 0 10px}
p{margin:0 0 10px}.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;min-height:52px}
.primary{background:var(--accent);color:var(--on-accent);font-weight:700;width:100%}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tag{display:inline-block;font-size:15px;font-weight:700;color:#fff;border-radius:8px;padding:2px 10px}
.mobility{background:var(--mob)}.cardio{background:var(--car)}.strength{background:var(--str)}
.week{display:flex;gap:8px;justify-content:space-between;margin:10px 0 4px}
.dot{flex:1;text-align:center;font-size:15px;color:var(--mute)}
.dot i{display:flex;gap:2px;height:40px;border-radius:10px;border:2px solid var(--line);margin-bottom:4px;overflow:hidden}
.dot i b{flex:1}
.dot.today i{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.dot.today{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.session{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);margin-bottom:12px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:32px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);font-size:16px;min-height:56px}
nav button[aria-current="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.video{aspect-ratio:16/9;width:100%;border-radius:16px;background:var(--line);display:grid;place-items:center;color:var(--mute);text-align:center;padding:12px;margin-bottom:12px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;border-radius:16px}
#player{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 24px}
#player>div{max-width:560px;margin:0 auto}
.timer{font-size:84px;font-weight:700;text-align:center;line-height:1;margin:14px 0}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.note{font-size:calc(15px*var(--s,1));color:var(--mute)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between}.top b{font-size:20px}
.burger{background:var(--card);border:1px solid var(--line);color:var(--ink);width:52px;padding:0;display:grid;place-items:center}
#menu{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end}
#menu .sheet{background:var(--bg);width:min(340px,88%);height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 24px;overflow:auto}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{flex:1;padding:10px;min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.session{transition:box-shadow .3s,border-color .3s}.session.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.primary:disabled{opacity:.4;cursor:default}
.mgrp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.mgrp h3{margin:0 0 10px;font-size:calc(17px*var(--s,1))}
.opts button{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:12px}
.opts.col{flex-direction:column}.opts.col button{justify-content:space-between;text-align:left}
.mgrp .opts button{background:var(--bg)}
.mgrp .opts button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
@keyframes slide{from{transform:translateX(28px);opacity:0}}
#menu .sheet{animation:slide .2s ease-out}
@media (prefers-reduced-motion:reduce){#menu .sheet{animation:none}}
.danger{width:100%;background:transparent;color:var(--danger);border:2px solid var(--danger);font-weight:700}
.danger-fill{background:var(--danger);color:var(--on-danger);font-weight:700}
.danger-zone{margin-top:48px}
#dlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px}
#dlg .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:400px;width:100%}
#dlg .box h2{margin-top:0}#dlg .row button{flex:1}
.ach summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;min-height:40px}
.ach summary::-webkit-details-marker{display:none}
.ach summary span:after{content:"▾";margin-left:10px;display:inline-block;transition:transform .2s}
.ach[open] summary span:after{transform:rotate(180deg)}
.astats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.ach h3{margin:14px 0 10px;font-size:calc(17px*var(--s,1))}
.bgrid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;justify-items:center}
.badge{background:none;padding:4px;min-height:0;border-radius:16px;line-height:0}
.badge svg{width:64px;height:64px}
#bub{position:absolute;width:220px;z-index:3;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font-size:calc(15px*var(--s,1));line-height:1.35;text-align:left}
#bub:before{content:"";position:absolute;top:-6px;left:var(--ax,50%);width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.stat b small{font-size:16px}
body{overflow-x:hidden}
#app{position:relative}
#nb{position:absolute;width:100%;padding:20px 18px 110px;box-sizing:border-box;pointer-events:none}
.mon{border-top:1px solid var(--line);padding:4px 0}
.mon summary:after{content:"▾";transition:transform .2s}.mon[open] summary:after{transform:rotate(180deg)}
.mon summary{font-weight:700}
.msum{font-size:calc(15px*var(--s,1));color:var(--mute);margin:0 0 8px}
.wl{font-size:calc(13px*var(--s,1));color:var(--mute);margin:8px 0 0}
.mon .week{margin:8px 0}.mon .week:first-of-type{margin:2px 0;color:var(--mute)}.mon .dot{position:relative}
.mbs{position:absolute;top:-8px;right:-5px;display:flex;pointer-events:none;z-index:1}.mb{display:block;line-height:0}.mb+.mb{margin-left:-9px}.mb svg{width:18px;height:18px;display:block;filter:drop-shadow(0 0 1px var(--card))}.mon .dot i{height:26px}.mon .dot{font-size:calc(14px*var(--s,1))}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:6;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 24px}
#sheet>div{max-width:560px;margin:0 auto}
</style>
</head>

  const s = SESSIONS.find(x=>x.id===id), steps = s.levels[lv];
  $("#sheet").innerHTML = `<div><div class="top"><button class="ghost" onclick="openSheet('${id}')">‹ ${t("back")}</button><button class="burger" onclick="closeSheet()" aria-label="${t("close")}">${XI}</button></div>
  <p style="margin-top:16px"><span class="tag ${s.type}">${tn(s.type)}</span> <span class="tag" style="background:var(--ink);color:var(--bg)">${t("lv_"+lv)}</span></p>
  <h1>${L(s.name)}</h1><h2>${t("prog")}</h2>` +
  steps.map(e=>`<div class="card row"><b class="grow">${L(e.name)}</b><span class="mute">${Math.max(1,Math.round(e.secs/60))} min</span></div>`).join("") +
  `<button class="primary" style="margin-top:8px" onclick="start('${id}','${lv}')">${t("start")}</button></div>`;
  $("#sheet").scrollTop = 0;
}
function closeSheet(){ $("#sheet").hidden = true; }

/* ---- Session player ---- */
function start(id, lv){
  closeSheet(); lv = lv||"beginner";
  const s = SESSIONS.find(x=>x.id===id), steps = s.levels[lv]; let i=0, left=0, paused=false;
  $("#player").hidden=false; $("#tabs").hidden=true;
  function show(){
    const e = steps[i]; left = e.secs;
    $("#player").innerHTML = `<div><div class="row"><span class="tag ${e.type}">${tn(e.type)}</span><span class="grow"></span>
      <span class="mute">${i+1} ${t("of")} ${steps.length}</span></div>
      <h1>${L(e.name)}</h1>
      <div class="video">${e.video?`<video src="${e.video}" controls playsinline loop muted></video>`:t("demo")}</div>
      ${L(e.cue)?`<p>${L(e.cue)}</p>`:""}<div class="timer" id="t"></div>
      <div class="bar"><i id="b"></i></div>
      <div class="row"><button class="ghost grow" id="pp">${t("pause")}</button><button class="ghost grow" id="nx">${t("skip")}</button></div>
      <p style="margin-top:14px"><button class="ghost" style="width:100%" id="qt">${t("end")}</button></p></div>`;
    $("#pp").onclick=()=>{ paused=!paused; $("#pp").textContent=t(paused?"resume":"pause"); };
    $("#nx").onclick=next; $("#qt").onclick=()=>finish(false);
    tick();
  }
  function tick(){
    const e = steps[i];
    $("#t").textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
    $("#b").style.width = (100*(e.secs-left)/e.secs)+"%";
  }
  function next(){ i++; i<steps.length ? show() : finish(true); }
  function finish(ok){
    clearInterval(timer);
    if(ok){ log.push({date:day(new Date()), session:s.id, level:lv, mins:mins(s,lv)}); wr("fb-log",log); }
    $("#player").innerHTML = ok ? `<div><h1>${t("comp")}</h1><p class="mute">${mins(s,lv)} ${t("dtxt")}</p>
      <button class="primary" id="ok">${t("home")}</button></div>` : "";
    if(ok) $("#ok").onclick=close; else close();
  }
  function close(){ $("#player").hidden=true; $("#tabs").hidden=false; tab="today"; render(); }
  clearInterval(timer);
  timer = setInterval(()=>{ if(paused) return; left--; if(left<0) next(); else tick(); },1000);
  show();
}
apply(); render();
</script>
</body>
</html>
